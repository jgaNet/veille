name: feeds

on:
  push:
    branches: [main]
    paths:
      - "*/alerts/**/*.md"
      - "*/daily/**/*.md"
      - "*/feed.json"
      - "scripts/**"
      - ".github/workflows/feeds.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

env:
  SITE_URL: https://jganet.github.io/veille
  FEEDS_BASE: https://jganet.github.io/veille

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Générer les flux
        run: node scripts/build-feeds.mjs

      - name: Vérifier les flux
        run: node scripts/check-feeds.mjs

      - name: Préparer le site
        run: |
          mkdir -p _site
          cp -r feeds _site/feeds
          {
            echo '<!doctype html>'
            echo '<html lang="fr"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1">'
            echo '<title>Veille — flux RSS</title>'
            echo '<style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem;line-height:1.6}li{margin:.4rem 0}</style>'
            echo '</head><body>'
            echo '<h1>Veille — flux RSS</h1>'
            echo '<p>Alertes vérifiées, avec indice de confiance et sources croisées.</p>'
            echo '<ul>'
            for f in _site/feeds/*.xml; do
              n=$(basename "$f" .xml)
              echo "<li><a href=\"feeds/$n.xml\">$n</a></li>"
            done
            echo '</ul></body></html>'
          } > _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
